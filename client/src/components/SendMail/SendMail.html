<main class="MainContainer">
  <section class="Panel">
    <div class="Field">
      <label for="to">Recipient email</label>
      <input id="to" v-model="model.to" type="email" placeholder="name@example.com" />
    </div>
    <div class="Field">
      <label for="subject">Subject</label>
      <input id="subject" v-model="model.subject" type="text" />
    </div>
    <div class="Field">
      <label for="duration">Duration in minutes</label>
      <input id="duration" v-model="model.durationMinutes" type="number" min="0.1" step="0.1" />
    </div>

    <button class="Send" :disabled="sending" @click="sendEmail">
      {{ sending ? "Sending…" : "Send Email" }}
    </button>
  </section>
</main>
